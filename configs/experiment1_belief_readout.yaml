experiment:
  name: belief_readout_fidelity_v1
  question: "Does the elicited readout recover the agent's stable standalone judgment?"
  dataset: data/interim/medmcqa/medicine_sample_500.jsonl
  max_cases: 500
  standalone_repeats: 1
  probe_variants:
    - A
    - B
    - C
  use_unstable_cases_as_secondary_analysis: false
  evaluation_mode: zero_shot_standalone_once

paths:
  standalone_output: outputs/experiment1_belief_readout/standalone_screening.jsonl
  probe_output: outputs/experiment1_belief_readout/belief_probes.jsonl
  summary_output: outputs/experiment1_belief_readout/summary.json

prompts:
  belief_probe_A: prompts/belief_probe_A.txt
  belief_probe_B: prompts/belief_probe_B.txt
  belief_probe_C: prompts/belief_probe_C.txt
  consistency: prompts/belief_readout_consistency.txt

generation:
  standalone_seed_base: 1000
  probe_seed_base: 2000
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 512

definitions:
  stable_correct: "three identical standalone options equal ground truth"
  stable_incorrect: "three identical standalone options different from ground truth"
  unstable: "standalone options are not all identical"
  primary_metric: "mean(probe_current_judgment == reference_judgment)"
