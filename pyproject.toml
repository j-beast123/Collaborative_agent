[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa"
version = "0.1.0"
description = "SHERPA: online GRPO for a clinical collaborator Agent with ephemeral state-local rubrics and Rubric-Generator prompt evolution"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.51", "peft>=0.13", "safetensors"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]
